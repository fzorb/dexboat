[project]
name = "dexboat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "functions-framework>=3.10.2",
    "requests>=2.34.2",
]

[project.scripts]
dexboat = "dexboat:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
